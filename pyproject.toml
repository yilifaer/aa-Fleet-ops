[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-fleetops"
version = "0.1.0a5"
description = "Fleet lifecycle management for Alliance Auth"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "GPL-3.0-only"
authors = [{name = "AA FleetOps Contributors"}]
keywords = ["allianceauth", "eveonline", "fleet", "fleetops", "esi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "allianceauth>=5.2,<6",
  "django-esi>=9,<11",
  "requests>=2.31",
]

[project.optional-dependencies]
fittings = ["fittings>=2.3"]
sde = ["django-eveonline-sde>=0.0.1"]
test = ["coverage>=7"]


[tool.setuptools.packages.find]
include = ["fleetops*"]

[tool.setuptools.package-data]
fleetops = [
  "templates/fleetops/*.html",
  "templates/fleetops/configuration/*.html",
  "static/fleetops/*.css",
  "static/fleetops/*.js",
]
