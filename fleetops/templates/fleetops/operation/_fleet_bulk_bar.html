{% if fleet_can_manage and fleet_live %}
<div class="d-none align-items-center gap-2 mb-2" id="fleet-bulk-bar">
  <span id="fleet-bulk-count">0 selected</span>
  <button type="button" class="btn btn-sm btn-outline-primary" id="fleet-bulk-move" data-fleet-move-open data-needs-write><i class="fa-solid fa-right-left" aria-hidden="true"></i> Move to…</button>
  <button type="button" class="btn btn-sm btn-link" id="fleet-bulk-clear">Clear</button>
</div>
<form method="post" action="{% url 'fleetops:fleet_members_move' operation.uuid %}" class="d-none" id="fleet-move-form" data-fleet-action>{% csrf_token %}<input type="hidden" name="role" value=""><input type="hidden" name="wing_id" value=""><input type="hidden" name="squad_id" value=""><button type="submit" tabindex="-1">Move</button></form>
<div class="modal fade" id="fleet-move-modal" tabindex="-1" aria-labelledby="fleet-move-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title" id="fleet-move-title">Move to…</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <p class="small text-muted" id="fleet-move-hint">Several members can only be moved into squads; commander positions take one member.</p>
      <div id="fleet-move-targets"></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button></div>
  </div></div>
</div>
{% endif %}
