{% load i18n %}
{% if fleet_can_write %}
<span class="fleet-actions">
  <button type="button" class="btn btn-sm btn-link p-0" data-fleet-rename-open title="{% translate 'Rename the squad' %}"><i class="fa-solid fa-pen" aria-hidden="true"></i><span class="visually-hidden">{% blocktranslate trimmed with name=squad.name %}Rename {{ name }}{% endblocktranslate %}</span></button>
  <form method="post" action="{% url 'fleetops:fleet_squad_rename' operation.uuid squad.id %}" class="d-none align-items-center gap-1" data-fleet-action data-fleet-rename>{% csrf_token %}<input type="text" name="name" maxlength="10" value="{{ squad.name }}" class="form-control form-control-sm w-auto" size="10" aria-label="{% translate 'Squad name' %}" required autocomplete="off"><button class="btn btn-sm btn-primary" title="{% translate 'Save the name' %}"><i class="fa-solid fa-check" aria-hidden="true"></i><span class="visually-hidden">{% translate "Save the name" %}</span></button></form>
  {% if squad.is_empty %}<form method="post" action="{% url 'fleetops:fleet_squad_delete' operation.uuid squad.id %}" class="d-inline" data-fleet-action data-confirm="{% blocktranslate trimmed with name=squad.name %}Delete the squad {{ name }}?{% endblocktranslate %}">{% csrf_token %}<button class="btn btn-sm btn-link text-danger p-0" title="{% translate 'Delete the squad' %}"><i class="fa-solid fa-trash" aria-hidden="true"></i><span class="visually-hidden">{% blocktranslate trimmed with name=squad.name %}Delete {{ name }}{% endblocktranslate %}</span></button></form>{% endif %}
</span>
{% endif %}
