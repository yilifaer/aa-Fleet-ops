{% load i18n static fleetops_i18n %}
{% if kick_enabled %}
<div id="fleet-control-fragment">{% include "fleetops/operation/_controls_card.html" %}</div>
<div class="modal fade" id="kickListModal" tabindex="-1" aria-hidden="true" data-preview-url="{% url 'fleetops:kick_preview' operation.uuid %}" data-capsules-url="{% url 'fleetops:kick_capsules' operation.uuid %}" data-system-url="{% url 'fleetops:kick_outside_system' operation.uuid %}">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <form method="post" id="kick-list-form">{% csrf_token %}
      <div class="modal-header"><h5 class="modal-title" id="kick-list-title">{% translate "Kick members" %}</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'Close' %}"></button></div>
      <div class="modal-body">
        <div id="kick-list-systems" class="mb-3"></div>
        <div id="kick-list-status" class="small text-muted mb-2"></div>
        <div id="kick-list-members"></div>
      </div>
      <div class="modal-footer"><span class="me-auto fw-bold" id="kick-list-summary"></span><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">{% translate "Cancel" %}</button><button class="btn btn-danger" id="kick-list-submit" disabled>{% translate "Kick" %}</button></div>
    </form>
  </div></div>
</div>
<script src="{% static 'fleetops/fleet_kick.js' %}?v={% fleetops_version %}"></script>
<script>
(function(){
  // The card is replaced while the page is open (Fleet tab updates), so its buttons are handled on the document.
  document.addEventListener('submit',event=>{
    const trigger=event.target;
    if(!(trigger instanceof HTMLFormElement) || !trigger.classList.contains('kick-list-trigger')){ return; }
    if(window.bootstrap){ event.preventDefault(); window.FleetOpsKick.open(trigger.dataset.kickMode); return; }
    // Without the list window the names are confirmed in a plain dialog.
    if(!confirm(window.FleetOpsKick.confirmText(trigger.dataset.kickNames))){ event.preventDefault(); }
  });
  document.addEventListener('click',event=>{
    const button=event.target.closest('.kick-list-open');
    if(button && window.bootstrap){ window.FleetOpsKick.open(button.dataset.kickMode); }
  });
})();
</script>
{% endif %}
