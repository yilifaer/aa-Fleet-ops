{% load i18n %}
{% if can_classify and row.key %}
<form method="post" action="{% url 'fleetops:fleet_classify' operation.uuid %}" class="d-flex gap-1 fleet-classify" data-fleet-action>{% csrf_token %}
  <input type="hidden" name="type_id" value="{{ row.key }}">
  <select name="function_id" class="form-select form-select-sm" aria-label="{% blocktranslate trimmed with label=row.label %}Ship function for {{ label }}{% endblocktranslate %}" title="{% blocktranslate trimmed with label=row.label %}Count {{ label }} under a ship function{% endblocktranslate %}"><option value="">{% translate "Classify…" %}</option>{% for function in ship_functions %}<option value="{{ function.pk }}">{{ function.name }}</option>{% endfor %}</select>
  <noscript><button type="submit" class="btn btn-sm btn-outline-secondary">{% translate "Save" %}</button></noscript>
</form>
{% endif %}
