  <li class="nav-item"><a class="nav-link{% if active_tab == 'members' %} active{% endif %}"{% if active_tab == 'members' %} aria-current="page"{% endif %} href="{% if tab_corporation_id %}{% url 'fleetops:corporation_members_detail' tab_corporation_id %}{% else %}{% url 'fleetops:corporation_members' %}{% endif %}?year={{ year }}&amp;month={{ month }}">{% translate "Members" %}</a></li>
