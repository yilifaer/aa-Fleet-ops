{% extends "fleetops/base.html" %}{% block fleetops_content %}<h2>Audit Log</h2><div class="table-responsive mt-3"><table class="table table-sm"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Object</th><th>Reason</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.created_at }}</td><td>{{ row.actor|default:"System" }}</td><td>{{ row.action }}</td><td>{{ row.object_type }} #{{ row.object_id }}</td><td>{{ row.reason }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
