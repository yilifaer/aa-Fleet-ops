{% load i18n %}{% comment %}The shared confirmation dialog of every page (base.html includes it once). fleetops.js fills the title, the
question and the label of the confirm button; the ids are the contract with FleetOps.confirm.{% endcomment %}
<div class="modal fade" id="fo-confirm" tabindex="-1" aria-labelledby="fo-confirm-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="fo-confirm-title">{% translate "Please confirm" %}</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'Close' %}"></button>
    </div>
    <div class="modal-body"><p class="mb-0" id="fo-confirm-text"></p></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary" id="fo-confirm-cancel" data-bs-dismiss="modal">{% translate "Cancel" %}</button>
      <button type="button" class="btn btn-primary" id="fo-confirm-ok">{% translate "Confirm" %}</button>
    </div>
  </div></div>
</div>
